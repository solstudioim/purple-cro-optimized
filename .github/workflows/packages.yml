name: Build release packages
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-packages.py --output "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-packages
          path: ${{ runner.temp }}/packages/
      - name: Attach separate packages to a draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/packages/* --draft --generate-notes
